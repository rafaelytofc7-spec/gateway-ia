<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content">
<meta name="color-scheme" content="dark light">
<meta name="theme-color" content="#0E1012">
<meta name="description" content="Gateway de IA compatível com OpenAI: roteia entre provedores grátis, locais e pagos com fallback automático.">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/svg+xml" href="icon.svg">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>Gateway IA</title>
<link rel="stylesheet" href="style.css">
<script>/* aplica o tema antes de desenhar a página (evita piscar) */(function(){try{var t=(JSON.parse(localStorage.getItem('gw.settings')||'{}')||{}).theme;var d=t==='dark'||(t!=='light'&&!matchMedia('(prefers-color-scheme: light)').matches);document.documentElement.setAttribute('data-theme',d?'dark':'light');}catch(e){}})();</script>
</head>
<body>
<div id="app">
  <header class="topbar">
    <button class="icon-btn" id="btnDrawer" aria-label="Conversas">
      <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M4 7h16M4 12h16M4 17h10"/></svg>
    </button>
    <div class="brand">
      <svg class="logo" viewBox="0 0 32 32" width="26" height="26" fill="none" aria-label="Gateway IA">
        <path d="M4 9c5 0 6 7 11 7M4 16h11M4 23c5 0 6-7 11-7" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"/>
        <path d="M15 16h9" stroke="var(--accent)" stroke-width="2.6" stroke-linecap="round"/>
        <circle cx="15" cy="16" r="3.2" fill="var(--accent)"/>
        <path d="M23.5 12l5 4-5 4z" fill="var(--accent)"/>
      </svg>
      <span id="topTitle">Gateway IA</span>
    </div>
    <button class="btn small" id="btnInstall" hidden>Instalar</button>
    <button class="icon-btn" id="btnTheme" aria-label="Alternar tema claro/escuro" title="Alternar tema">
      <svg class="ico-moon" viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 14.5A8 8 0 0 1 9.5 4a8 8 0 1 0 10.5 10.5z"/></svg>
      <svg class="ico-sun" viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
    </button>
    <button class="icon-btn" id="btnNewChat" aria-label="Nova conversa" title="Nova conversa (Ctrl+K)">
      <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>
    </button>
  </header>

  <main id="views">
    <!-- CHAT -->
    <section class="view active" id="view-chat">
      <div class="messages" id="messages"></div>
      <div class="composer-wrap">
        <button class="to-bottom" id="toBottom" aria-label="Ir para o fim da conversa" hidden>
          <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 5v14M5 12l7 7 7-7"/></svg>
        </button>
        <button class="route-chip" id="routeChip"><span class="dot"></span><span id="routeChipText">Auto</span></button>
        <div id="projBar" class="proj-bar" hidden></div>
        <div id="attachRow" class="attach-row"></div>
        <div class="composer">
          <button class="icon-btn attach" id="btnAttach" aria-label="Anexar">
            <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 11.5l-8.6 8.6a5.5 5.5 0 0 1-7.8-7.8l8.6-8.6a3.7 3.7 0 0 1 5.2 5.2l-8.6 8.6a1.8 1.8 0 0 1-2.6-2.6l7.9-7.9"/></svg>
          </button>
          <input type="file" id="fileInput" hidden multiple>
          <textarea id="input" rows="1" placeholder="Mensagem"></textarea>
          <button class="icon-btn mic" id="btnMic" aria-label="Ditar por voz">
            <svg viewBox="0 0 24 24" width="21" height="21" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="3" width="6" height="11" rx="3"/><path d="M5 11a7 7 0 0 0 14 0M12 18v3"/></svg>
          </button>
          <button class="send" id="btnSend" aria-label="Enviar">
            <svg id="icoSend" viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M12 19V5M5 12l7-7 7 7"/></svg>
            <svg id="icoStop" viewBox="0 0 24 24" width="18" height="18" hidden><rect x="5" y="5" width="14" height="14" rx="2" fill="currentColor"/></svg>
          </button>
        </div>
        <div class="kbd-hint"><kbd>Enter</kbd> envia · <kbd>Shift</kbd>+<kbd>Enter</kbd> nova linha · <kbd>↑</kbd> edita a última · <kbd>Ctrl</kbd>+<kbd>K</kbd> nova conversa</div>
      </div>
    </section>

    <!-- CRIAR -->
    <section class="view" id="view-create">
      <div class="scroll pad" id="createPanel"></div>
    </section>

    <!-- PROVEDORES -->
    <section class="view" id="view-providers">
      <div class="scroll pad" id="providersList"></div>
    </section>

    <!-- ROTAS -->
    <section class="view" id="view-route">
      <div class="scroll pad" id="routePanel"></div>
    </section>

    <!-- GUIA -->
    <section class="view" id="view-guide">
      <div class="scroll pad" id="guidePanel"></div>
    </section>
  </main>

  <nav class="tabbar">
    <button class="tab active" data-view="chat" title="Chat">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12a8 8 0 0 1-11.6 7.1L4 20l1-4.6A8 8 0 1 1 21 12z"/></svg>
      <span>Chat</span>
    </button>
    <button class="tab" data-view="create" title="Criar">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3l1.9 4.6L18.5 9.5l-4.6 1.9L12 16l-1.9-4.6L5.5 9.5l4.6-1.9z"/><path d="M19 15l.8 2.2L22 18l-2.2.8L19 21l-.8-2.2L16 18l2.2-.8z"/></svg>
      <span>Criar</span>
    </button>
    <button class="tab" data-view="providers" title="Provedores">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="6" rx="2"/><rect x="3" y="14" width="18" height="6" rx="2"/><path d="M7 7h.01M7 17h.01"/></svg>
      <span>Provedores</span>
    </button>
    <button class="tab" data-view="route" title="Rotas">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 6c5 0 6 6 10 6M3 12h10M3 18c5 0 6-6 10-6M13 12h8M18 9l3 3-3 3"/></svg>
      <span>Rotas</span>
    </button>
    <button class="tab" data-view="guide" title="Mais">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 5a2 2 0 0 1 2-2h13v16H6a2 2 0 0 0-2 2z"/><path d="M4 19V5M9 7h6"/></svg>
      <span>Mais</span>
    </button>
  </nav>

  <!-- Gaveta de conversas -->
  <div class="scrim" id="scrim"></div>
  <aside class="drawer" id="drawer">
    <div class="drawer-head">
      <div class="drawer-brand">
        <svg viewBox="0 0 32 32" width="24" height="24" fill="none" aria-hidden="true">
          <path d="M4 9c5 0 6 7 11 7M4 16h11M4 23c5 0 6-7 11-7" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"/>
          <path d="M15 16h9" style="stroke:var(--accent)" stroke-width="2.6" stroke-linecap="round"/>
          <circle cx="15" cy="16" r="3.2" style="fill:var(--accent)"/>
          <path d="M23.5 12l5 4-5 4z" style="fill:var(--accent)"/>
        </svg>
        <strong>Gateway IA</strong>
      </div>
    </div>
    <button class="new-chat" id="btnNewChat2" title="Nova conversa (Ctrl+K)">
      <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>
      <span>Nova conversa</span><kbd>Ctrl K</kbd>
    </button>
    <div class="drawer-search"><input class="input" id="chatSearch" type="search" placeholder="Buscar nas conversas"></div>
    <div class="drawer-list" id="chatList"></div>
  </aside>

  <!-- Bottom sheet genérico -->
  <div class="sheet" id="sheet" role="dialog" aria-modal="true">
    <div class="sheet-grip"></div>
    <div class="sheet-body" id="sheetBody"></div>
  </div>

  <div class="toast" id="toast"></div>
</div>
<script src="data.js"></script>
<script src="app.js"></script>
<script src="media.js"></script>
<script src="project.js"></script>
</body>
</html>
